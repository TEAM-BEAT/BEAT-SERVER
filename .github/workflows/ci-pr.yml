name: ci-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # secrets는 if: 조건식에서 직접 참조할 수 없다(GitHub 공식 문서).
    # job-level env로 승격 후 env 컨텍스트로 검사한다.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Gradle caching
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-cleanup: on-success

      # Hard gate: the catalog has no intentional unused aliases today. If a temporary
      # exception is ever needed, document it with a reason in the allowlist path
      # printed by the checker and remove it when the migration closes.
      - name: Check unused version catalog aliases
        run: python3 .github/scripts/check_unused_version_catalog_aliases.py
        shell: bash

      - name: Generate and verify OpenAPI documents
        run: |
          chmod +x gradlew
          ./gradlew :apps:api:openApiTest :apps:admin:openApiTest --build-cache
        shell: bash

      - name: Verify Gradle check
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: beat-server@${{ github.sha }}
        run: |
          chmod +x gradlew
          ./gradlew check verifyModuleBootJars --parallel --build-cache
        shell: bash

      - name: Cache SonarCloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Cloud Analysis (Kover coverage, JDK 25)
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: beat-server@${{ github.sha }}
        run: |
          chmod +x gradlew
          ./gradlew sonar --build-cache
        shell: bash

      - name: Verify OpenAPI compatibility from Gradle check artifacts
        env:
          OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha }}
          OPENAPI_BREAKING_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'openapi-breaking-approved') }}
        run: |
          bash .github/scripts/test_verify_openapi_baseline_source.sh
          bash .github/scripts/test_openapi_compatibility_checks.sh
          bash .github/scripts/verify_openapi_compatibility.sh
        shell: bash

      - name: Stage bootJars for downstream image build
        run: |
          mkdir -p staged-jars
          for module in apis admin batch; do
            case "$module" in
              apis) module_dir=apps/api ;;
              admin) module_dir=apps/admin ;;
              batch) module_dir=apps/batch ;;
            esac
            JAR=$(find "${module_dir}/build/libs" -maxdepth 1 -name "${module}-*.jar" ! -name '*-plain.jar' | head -n 1)
            [ -n "$JAR" ] || { echo "No bootJar produced for ${module}" >&2; exit 1; }
            cp "$JAR" "staged-jars/${module}.jar"
          done
          ls -lh staged-jars
        shell: bash

      - name: Upload bootJars artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootjars
          path: staged-jars/
          if-no-files-found: error
          retention-days: 1

      # Advisory phase: buildHealth is intentionally non-blocking on first adoption.
      # Promote to a hard gate only after the report is triaged into:
      # - immediate fixes,
      # - intentional false positives / runtime-only cases with documented plugin config,
      # - follow-up cleanup issues.
      # Then remove continue-on-error and switch dependencyAnalysis severity from warn to fail.
      - name: Generate dependency health report
        continue-on-error: true
        run: |
          ./gradlew buildHealth --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" --build-cache
        shell: bash

  scan-images:
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module:
          - apis
          - admin
          - batch
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Download bootJars artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bootjars
          path: staged-jars

      - name: Prepare app.jar for Docker build context
        env:
          MODULE: ${{ matrix.module }}
        run: |
          [ -f "staged-jars/${MODULE}.jar" ] || { echo "Missing staged-jars/${MODULE}.jar" >&2; exit 1; }
          cp "staged-jars/${MODULE}.jar" app.jar
          ls -lh app.jar
        shell: bash

      - name: Build scan image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.module
          load: true
          tags: beat-scan:${{ matrix.module }}
          build-args: |
            MODULE=${{ matrix.module }}
          cache-from: type=gha,scope=ci-pr-${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=ci-pr-${{ matrix.module }}

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: beat-scan:${{ matrix.module }}
          trivy-config: .trivy-image.yaml
