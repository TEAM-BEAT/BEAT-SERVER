name: ci-pr

on:
  pull_request:

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Gradle caching
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-cleanup: on-success

      # Hard gate: the catalog has no intentional unused aliases today. If a temporary
      # exception is ever needed, document it with a reason in the allowlist path
      # printed by the checker and remove it when the migration closes.
      - name: Check unused version catalog aliases
        run: python3 .github/scripts/check_unused_version_catalog_aliases.py
        shell: bash

      - name: Generate and verify OpenAPI documents
        run: |
          chmod +x gradlew
          ./gradlew :apps:api:openApiTest :apps:admin:openApiTest --build-cache
        shell: bash

  gradle-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Gradle caching
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-cleanup: on-success

      - name: Verify Gradle check
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: beat-server@${{ github.sha }}
        run: |
          chmod +x gradlew
          ./gradlew check --parallel --build-cache -x :apps:api:openApiTest -x :apps:admin:openApiTest
        shell: bash

      - name: Stage bootJars for downstream image build
        run: |
          mkdir -p staged-jars
          for module in apis admin batch; do
            case "$module" in
              apis) module_dir=apps/api ;;
              admin) module_dir=apps/admin ;;
              batch) module_dir=apps/batch ;;
            esac
            JAR=$(find "${module_dir}/build/libs" -maxdepth 1 -name "${module}-*.jar" ! -name '*-plain.jar' | head -n 1)
            [ -n "$JAR" ] || { echo "No bootJar produced for ${module}" >&2; exit 1; }
            cp "$JAR" "staged-jars/${module}.jar"
          done
          ls -lh staged-jars
        shell: bash

      - name: Upload bootJars artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootjars
          path: staged-jars/
          if-no-files-found: error
          retention-days: 1

      - name: Upload Sonar inputs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-inputs
          path: |
            build/reports/kover/report.xml
            apps/api/build/classes/kotlin/main
            apps/admin/build/classes/kotlin/main
            apps/batch/build/classes/kotlin/main
            application/admin/build/classes/kotlin/main
            application/frontoffice/build/classes/kotlin/main
            application/system/build/classes/kotlin/main
            domain/build/classes/kotlin/main
            infrastructure/build/classes/kotlin/main
            support/observability/build/classes/kotlin/main
            support/security/build/classes/kotlin/main
            support/security-web/build/classes/kotlin/main
          if-no-files-found: error
          retention-days: 1

  dependency-health:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Gradle caching
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-cleanup: on-success

      # Advisory phase: buildHealth is intentionally non-blocking on first adoption.
      # Promote to a hard gate only after the report is triaged into:
      # - immediate fixes,
      # - intentional false positives / runtime-only cases with documented plugin config,
      # - follow-up cleanup issues.
      # Then remove continue-on-error and switch dependencyAnalysis severity from warn to fail.
      - name: Generate dependency health report
        continue-on-error: true
        run: |
          ./gradlew buildHealth --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" --build-cache
        shell: bash

  fork-dependency-policy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Block dependency-sensitive changes from external forks
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "${IS_FORK}" != "true" ]]; then
            echo "Same-repository PR; fork dependency policy does not apply."
            exit 0
          fi

          sensitive_files=()
          page=1

          while :; do
            response="$(
              curl --fail --silent --show-error --location \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100&page=${page}"
            )"

            count="$(jq 'length' <<<"${response}")"

            while IFS= read -r encoded; do
              [[ -n "${encoded}" ]] || continue
              file="$(printf '%s' "${encoded}" | base64 --decode)"

              case "${file}" in
                renovate.json|.github/dependabot.yml|gradle.properties|gradlew|gradlew.bat|\
                build.gradle|build.gradle.kts|settings.gradle|settings.gradle.kts|\
                gradle/*|build-logic/*|*/build.gradle|*/build.gradle.kts|*/settings.gradle|*/settings.gradle.kts|\
                package.json|package-lock.json|*/package.json|*/package-lock.json|\
                Dockerfile|Dockerfile.*|*/Dockerfile|*/Dockerfile.*|\
                .github/workflows/*|.github/actions/*|\
                requirements.txt|requirements-*.txt|*/requirements.txt|*/requirements-*.txt|\
                requirements.yml|requirements.yaml|*/requirements.yml|*/requirements.yaml|\
                ops/ansible/*/requirements*|ops/ansible/*/*/requirements*)
                  sensitive_files+=("${file}")
                  ;;
              esac
            done < <(jq -r '.[].filename | @base64' <<<"${response}")

            if (( count < 100 )); then
              break
            fi

            # GitHub's endpoint returns at most 3,000 files. Fail closed if a PR
            # reaches that boundary because we cannot prove there are no additional
            # dependency-sensitive paths.
            if (( page >= 30 )); then
              echo "Cannot safely classify a fork PR with 3,000 or more changed files." >&2
              exit 1
            fi

            ((page += 1))
          done

          if (( ${#sensitive_files[@]} > 0 )); then
            echo "External fork PR changes dependency-sensitive files:" >&2
            printf ' - %q\n' "${sensitive_files[@]}" >&2
            echo "Move these commits to a maintainer-owned branch and run the full resolved dependency verification before merging." >&2
            exit 1
          fi

          echo "External fork PR changes no dependency-sensitive files."
        shell: bash

  dependency-snapshot:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.base_ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Gradle caching
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-cleanup: on-success

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          dependency-graph: generate-and-submit
          dependency-graph-include-configurations: "^runtimeClasspath$"

  dependency-review:
    needs: dependency-snapshot
    if: >
      always() &&
      !cancelled() &&
      github.base_ref == github.event.repository.default_branch &&
      (needs.dependency-snapshot.result == 'success' ||
       needs.dependency-snapshot.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          show-patched-versions: true
          license-check: false
          retry-on-snapshot-warnings: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          retry-on-snapshot-warnings-timeout: 300

  lambda-security:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert ARM64 runner
        run: |
          test "$(uname -m)" = "aarch64"
        shell: bash

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ops/aws/lambda/image-processing/package-lock.json

      - name: Install ARM64 production dependencies without lifecycle scripts
        working-directory: ops/aws/lambda/image-processing
        run: |
          npm ci \
            --omit=dev \
            --include=optional \
            --ignore-scripts \
            --os=linux \
            --cpu=arm64 \
            --libc=glibc \
            --no-audit \
            --no-fund
        shell: bash

      - name: Verify ARM64 Sharp packages and native loading
        working-directory: ops/aws/lambda/image-processing
        run: |
          test -d node_modules/@img/sharp-linux-arm64
          test -d node_modules/@img/sharp-libvips-linux-arm64
          node --input-type=module -e "const sharp = (await import('sharp')).default; if (!sharp?.versions?.vips) process.exit(1); console.log(sharp.versions)"
        shell: bash

      - name: Run Lambda filesystem Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ops/aws/lambda/image-processing
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  sonar:
    needs: gradle-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      analysis-result: ${{ steps.sonar-analysis.outcome }}
    # secrets는 if: 조건식에서 직접 참조할 수 없다(GitHub 공식 문서).
    # job-level env로 승격 후 env 컨텍스트로 검사한다.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Gradle caching
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-cleanup: on-success

      - name: Cache SonarCloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download Sonar inputs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-inputs
          path: .

      - name: SonarQube Cloud Analysis (Kover coverage, JDK 25)
        id: sonar-analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: beat-server@${{ github.sha }}
        run: |
          chmod +x gradlew
          ./gradlew sonar -x koverXmlReport --build-cache -Dsonar.qualitygate.wait=true
        shell: bash

  scan-images:
    needs: [gradle-check, openapi]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module:
          - apis
          - admin
          - batch
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Download bootJars artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bootjars
          path: staged-jars

      - name: Prepare app.jar for Docker build context
        env:
          MODULE: ${{ matrix.module }}
        run: |
          [ -f "staged-jars/${MODULE}.jar" ] || { echo "Missing staged-jars/${MODULE}.jar" >&2; exit 1; }
          cp "staged-jars/${MODULE}.jar" app.jar
          ls -lh app.jar
        shell: bash

      - name: Build scan image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.module
          load: true
          tags: beat-scan:${{ matrix.module }}
          build-args: |
            MODULE=${{ matrix.module }}
          cache-from: type=gha,scope=ci-pr-${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=ci-pr-${{ matrix.module }}

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: beat-scan:${{ matrix.module }}
          trivy-config: .trivy-image.yaml

  verify:
    if: ${{ !cancelled() }}
    needs:
      [
        openapi,
        gradle-check,
        sonar,
        scan-images,
        fork-dependency-policy,
        dependency-review,
        lambda-security,
      ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Confirm required checks passed
        env:
          OPENAPI_RESULT: ${{ needs.openapi.result }}
          GRADLE_CHECK_RESULT: ${{ needs.gradle-check.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          SONAR_ANALYSIS_RESULT: ${{ needs.sonar.outputs.analysis-result }}
          SCAN_IMAGES_RESULT: ${{ needs.scan-images.result }}
          FORK_DEPENDENCY_POLICY_RESULT: ${{ needs.fork-dependency-policy.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          LAMBDA_SECURITY_RESULT: ${{ needs.lambda-security.result }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          results=(
            "openapi=${OPENAPI_RESULT}"
            "gradle-check=${GRADLE_CHECK_RESULT}"
            "sonar=${SONAR_RESULT}"
            "scan-images=${SCAN_IMAGES_RESULT}"
            "fork-dependency-policy=${FORK_DEPENDENCY_POLICY_RESULT}"
            "lambda-security=${LAMBDA_SECURITY_RESULT}"
          )
          for result in "${results[@]}"; do
            if [[ "${result#*=}" != "success" ]]; then
              echo "Required CI check did not pass: ${result}" >&2
              exit 1
            fi
          done

          if [[ "${BASE_REF}" == "${DEFAULT_BRANCH}" ]]; then
            if [[ "${DEPENDENCY_REVIEW_RESULT}" != "success" ]]; then
              echo "Dependency Review must pass for PRs targeting the default branch: ${DEPENDENCY_REVIEW_RESULT}" >&2
              exit 1
            fi
          elif [[ "${BASE_REF}" == "main" && "${HEAD_REF}" == "${DEFAULT_BRANCH}" ]]; then
            if [[ "${DEPENDENCY_REVIEW_RESULT}" != "skipped" ]]; then
              echo "Dependency Review must be skipped for ${DEFAULT_BRANCH} -> main promotion PRs: ${DEPENDENCY_REVIEW_RESULT}" >&2
              exit 1
            fi
          else
            echo "Unsupported PR route: ${HEAD_REF} -> ${BASE_REF}. Merge changes through ${DEFAULT_BRANCH} before promoting to main." >&2
            exit 1
          fi

          case "${SONAR_ANALYSIS_RESULT}" in
            success)
              ;;
            skipped)
              echo "Sonar analysis skipped because SONAR_TOKEN is unavailable"
              ;;
            *)
              echo "Sonar analysis did not complete: ${SONAR_ANALYSIS_RESULT}" >&2
              exit 1
              ;;
          esac
          echo "Required CI checks passed"
        shell: bash
