version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    assignees:
      - move-hoon
      - hyerinhwang-sailin
      - imddoy
    # Java runtime major upgrades require a coordinated JDK migration.
    ignore:
      - dependency-name: eclipse-temurin
        versions:
          - ">= 26"
