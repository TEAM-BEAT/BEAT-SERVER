---
- name: Build app container environment
  ansible.builtin.set_fact:
    app_container_env: >-
      {{
        {
          'SPRING_PROFILES_ACTIVE': app_container_runtime_module_cfg.spring_profile,
          'BEAT_LOG_FORMAT': 'json',
          'SENTRY_RELEASE': 'beat-server@' ~ (
            app_container_runtime_release_ref
            | default(commit_sha | default(image_tag | default('unknown', true), true), true)
          )
        }
        | combine({
          (app_container_runtime_module_cfg.spring_profile | upper ~ '_ACTUATOR_PORT'): actuator_port | string,
          (app_container_runtime_module_cfg.spring_profile | upper ~ '_ACTUATOR_PATH'): actuator_path
        })
        | combine(
          {
            'DB_HIKARI_MAX_POOL_SIZE': app_container_runtime_module_cfg.hikari_max_pool_size | string
          }
          if app_container_runtime_module_cfg.hikari_max_pool_size is defined
          else {}
        )
        | combine(app_container_runtime_module_cfg.env | default({}))
        | combine({
          'OTEL_SERVICE_NAME': 'beat-' ~ module,
          'OTEL_RESOURCE_ATTRIBUTES':
            'service.namespace=beat,service.version=' ~ (
              app_container_runtime_release_ref
              | default(commit_sha | default(image_tag | default('unknown', true), true), true)
            ) ~ ',deployment.environment.name=' ~ (
              'development'
              if app_container_runtime_module_cfg.spring_profile == 'dev'
              else 'production'
            ) ~ ',service.instance.id=' ~ (
              app_container_runtime_container_name
              | default(app_container_runtime_module_cfg.container_name | default(module), true)
            ) ~ (
              ',beat.deployment.color=' ~ app_container_runtime_deployment_color
              if app_container_runtime_deployment_color is defined
              else ''
            )
        })
      }}
