spring:
  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

cloud:
  aws:
    region: ap-northeast-2
  stack:
    auto: false

---
spring:
  config:
    activate:
      on-profile: dev
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${DEV_KAKAO_CLIENT_ID}
            client-secret: ${DEV_KAKAO_CLIENT_SECRET}
            redirect-uri: ${DEV_KAKAO_REDIRECT_URI}
            client-authentication-method: post
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
            client-name: Kakao
  coolsms:
    api:
      key: ${DEV_COOLSMS_KEY}
      secret: ${DEV_COOLSMS_SECRET}
      number: ${DEV_COOLSMS_NUMBER}

cloud:
  aws:
    credentials:
      access-key: ${DEV_S3_ACCESS_KEY}
      secret-key: ${DEV_S3_SECRET_KEY}
  s3:
    bucket: ${DEV_S3_BUCKET}
    key-prefix: dev
  cdn:
    domain: "https://cdn.dev.beatlive.kr"

slack:
  webhook:
    member-url: ${DEV_SLACK_MEMBER_WEBHOOK_URL}
    booking-url: ${DEV_SLACK_BOOKING_WEBHOOK_URL}

---
spring:
  config:
    activate:
      on-profile: prod
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${PROD_KAKAO_CLIENT_ID}
            client-secret: ${PROD_KAKAO_CLIENT_SECRET}
            redirect-uri: ${PROD_KAKAO_REDIRECT_URI}
            client-authentication-method: post
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
            client-name: Kakao
  coolsms:
    api:
      key: ${PROD_COOLSMS_KEY}
      secret: ${PROD_COOLSMS_SECRET}
      number: ${PROD_COOLSMS_NUMBER}

cloud:
  aws:
    credentials:
      access-key: ${PROD_S3_ACCESS_KEY}
      secret-key: ${PROD_S3_SECRET_KEY}
  s3:
    bucket: ${PROD_S3_BUCKET}
    key-prefix: prod
  cdn:
    domain: "https://cdn.beatlive.kr"

slack:
  webhook:
    member-url: ${PROD_SLACK_MEMBER_WEBHOOK_URL}
    booking-url: ${PROD_SLACK_BOOKING_WEBHOOK_URL}
