---
# dev-environment overrides for the image_cdn role.
# Bucket names, alarm email, and ACM cert ARN are sourced from secrets.sops.yml.

image_cdn_custom_domain: "cdn.dev.beatlive.kr"

# Add the following keys to secrets.sops.yml (use `sops` to edit):
#
#   image_cdn_source_bucket: origin-bucket-name
#   image_cdn_lambda_code_bucket: deploy-artifacts-bucket-name
#   image_cdn_transformed_bucket_name: transformed-bucket-name
#   image_cdn_alarm_email: alerts-dev@example.com
#   image_cdn_acm_cert_arn: "arn:aws:acm:us-east-1:<account>:certificate/<id>"
