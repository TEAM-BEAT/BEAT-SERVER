[versions]
archunit = "1.5.0"
spring-boot = "4.0.8"
dependency-management = "1.1.7"
kotlin = "2.3.21"
kotlin-logging = "8.0.4"
kotlinx-coroutines = "1.10.2"
sonarqube = "7.2.3.7755"
kover = "0.9.7"
spring-cloud = "2025.1.3"
springdoc = "3.0.2"
commons-fileupload = "1.6.0"
jjwt = "0.13.0"
aws-sdk-v1 = "1.12.797"
testcontainers = "2.0.5"
redis-testcontainers = "2.2.4"
sentry = "8.41.0"
sentry-gradle-plugin = "6.6.0"
# Micrometer Tracing / OpenTelemetry 버전은 Spring Boot 4.0 BOM 이 관리 (spring-boot-starter-opentelemetry 가 정렬된 transitive 제공)
# JUnit Platform/Jupiter is the baseline for existing Java tests and Spring Boot starter-test.
# Kotlin migration may add Kotest/MockK as an optional Kotlin test layer on top of this baseline,
# not as a replacement for the shared JUnit Platform execution contract.
junit = "6.0.3"
kotest = "6.2.4"
mockk = "1.14.11"
dependency-analysis = "3.11.0"
kotlin-jdsl = "3.8.2"

[plugins]
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis" }

[libraries]
spring-context = { module = "org.springframework:spring-context" }
spring-tx = { module = "org.springframework:spring-tx" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5-jvm", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core-jvm", version.ref = "kotest" }
kotest-extensions-spring = { module = "io.kotest:kotest-extensions-spring", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-logging-jvm = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
kotlinx-coroutines-slf4j = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j", version.ref = "kotlinx-coroutines" }
lombok = { module = "org.projectlombok:lombok", version = "1.18.44" }
sentry-spring-boot-starter = { module = "io.sentry:sentry-spring-boot-4-starter", version.ref = "sentry" }
sentry-async-profiler = { module = "io.sentry:sentry-async-profiler", version.ref = "sentry" }
sentry-log4j2 = { module = "io.sentry:sentry-log4j2", version.ref = "sentry" }
log4j-layout-template-json = { module = "org.apache.logging.log4j:log4j-layout-template-json", version = "2.26.0" }

mysql-connector-j = { module = "com.mysql:mysql-connector-j", version = "9.6.0" }

# Kotlin JDSL — read/query adapter 의 type-safe JPQL DSL.
# hibernate-support 는 EntityManager.createQuery extension 만 제공한다(Executor/auto-config 미포함).
# Spring Data 통합 모듈(spring-data-jpa-*-support)을 쓰면 사용하지 않는 KotlinJdslJpqlExecutor /
# repository post-processor 가 강제 등록되어 부팅 시 EntityManager 와 충돌하므로 사용하지 않는다.
kotlin-jdsl-jpql-dsl = { module = "com.linecorp.kotlin-jdsl:jpql-dsl", version.ref = "kotlin-jdsl" }
kotlin-jdsl-jpql-render = { module = "com.linecorp.kotlin-jdsl:jpql-render", version.ref = "kotlin-jdsl" }
kotlin-jdsl-hibernate-support = { module = "com.linecorp.kotlin-jdsl:hibernate-support", version.ref = "kotlin-jdsl" }
spring-boot-core = { module = "org.springframework.boot:spring-boot", version.ref = "spring-boot" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-persistence = { module = "org.springframework.boot:spring-boot-persistence", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test", version.ref = "spring-boot" }
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient", version.ref = "spring-boot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "spring-boot" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "spring-boot" }
spring-boot-data-jpa-test = { module = "org.springframework.boot:spring-boot-data-jpa-test", version.ref = "spring-boot" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring-boot" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "spring-boot" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis", version.ref = "spring-boot" }
spring-boot-data-redis-test = { module = "org.springframework.boot:spring-boot-data-redis-test", version.ref = "spring-boot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
spring-boot-starter-log4j2 = { module = "org.springframework.boot:spring-boot-starter-log4j2", version.ref = "spring-boot" }
commons-fileupload = { module = "commons-fileupload:commons-fileupload", version.ref = "commons-fileupload" }

spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-starter-openfeign = { module = "org.springframework.cloud:spring-cloud-starter-openfeign" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

aws-java-sdk-bom = { module = "com.amazonaws:aws-java-sdk-bom", version.ref = "aws-sdk-v1" }
aws-java-sdk-s3 = { module = "com.amazonaws:aws-java-sdk-s3" }

nurigo-java-sdk = { module = "net.nurigo:javaSDK", version = "2.2" }

micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
# Spring Boot 4.0 OTLP tracing starter — micrometer-tracing-bridge-otel + opentelemetry-sdk + opentelemetry-exporter-otlp + opentelemetry-api 를 BOM 정렬된 버전으로 transitive 제공
spring-boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry", version.ref = "spring-boot" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-redis = { module = "com.redis:testcontainers-redis", version.ref = "redis-testcontainers" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers", version.ref = "spring-boot" }

[bundles]
boot-app-core = [
    "spring-boot-starter",
    "spring-boot-starter-actuator",
    "spring-boot-starter-data-jpa",
    "jackson-module-kotlin",
    "kotlin-reflect"
]
integration-testcontainers = [
    "testcontainers-mysql",
    "testcontainers-junit-jupiter",
    "testcontainers-redis",
    "spring-boot-testcontainers"
]
